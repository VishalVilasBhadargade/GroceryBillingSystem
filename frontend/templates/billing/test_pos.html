{% extends 'base.html' %}

{% block title %}POS Test - Grocery Billing System{% endblock %}

{% block content %}
<div class="container my-4">
    <h1>POS JavaScript Test Page</h1>
    
    <div class="card mb-3">
        <div class="card-header">
            <h5>System Check</h5>
        </div>
        <div class="card-body">
            <div id="test-results"></div>
            <button class="btn btn-primary" onclick="runTests()">Run Tests</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5>Product Data</h5>
        </div>
        <div class="card-body">
            <pre id="product-data"></pre>
        </div>
    </div>
</div>

<script>
    // Product data passed from backend
    var products = {{ products|safe }};
    
    function runTests() {
        const results = document.getElementById('test-results');
        let html = '<ul class="list-group">';
        
        // Test 1: Products variable exists
        if (typeof products !== 'undefined') {
            html += '<li class="list-group-item list-group-item-success">✓ Products variable exists</li>';
        } else {
            html += '<li class="list-group-item list-group-item-danger">✗ Products variable NOT found</li>';
        }
        
        // Test 2: Products is an array
        if (Array.isArray(products)) {
            html += '<li class="list-group-item list-group-item-success">✓ Products is an array</li>';
        } else {
            html += '<li class="list-group-item list-group-item-danger">✗ Products is NOT an array</li>';
        }
        
        // Test 3: Products has items
        if (products && products.length > 0) {
            html += `<li class="list-group-item list-group-item-success">✓ Found ${products.length} products</li>`;
        } else {
            html += '<li class="list-group-item list-group-item-danger">✗ No products found</li>';
        }
        
        // Test 4: First product structure
        if (products && products.length > 0) {
            const firstProduct = products[0];
            if (firstProduct.id && firstProduct.product_name && firstProduct.selling_price) {
                html += '<li class="list-group-item list-group-item-success">✓ Product structure is correct</li>';
            } else {
                html += '<li class="list-group-item list-group-item-danger">✗ Product structure is incorrect</li>';
            }
        }
        
        // Test 5: DOM elements
        const searchInput = document.getElementById('product_search');
        if (searchInput) {
            html += '<li class="list-group-item list-group-item-info">Note: This is test page - actual POS page has product_search input</li>';
        } else {
            html += '<li class="list-group-item list-group-item-warning">⚠ product_search input not found (expected on test page)</li>';
        }
        
        html += '</ul>';
        results.innerHTML = html;
        
        // Display product data
        document.getElementById('product-data').textContent = JSON.stringify(products, null, 2);
    }
    
    // Auto-run tests on load
    window.addEventListener('load', runTests);
</script>
{% endblock %}
