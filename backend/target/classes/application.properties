# Grocery Store Billing System - Spring Boot Backend Configuration

## Application Server Configuration
spring.application.name=grocery-billing-system
server.port=8080
management.endpoints.web.exposure.include=health,info

## Database Configuration
# Using H2 embedded database for demo/testing
spring.datasource.url=jdbc:h2:mem:grocery_billing_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

## H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

## Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

## JWT Configuration
jwt.secret=grocery_billing_system_secret_key_change_in_production_environment_with_strong_key
jwt.expiration=86400000
jwt.refresh-expiration=604800000

## Logging Configuration
logging.level.root=INFO
logging.level.com.grocerystore.billing=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/grocery-billing-system.log

## File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

## Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

## WhatsApp Notifications (Twilio)
whatsapp.enabled=true
whatsapp.default-country-code=+91
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from-number=${TWILIO_WHATSAPP_FROM_NUMBER:}
