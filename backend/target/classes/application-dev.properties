# Development Configuration with H2 Database (No MySQL Required)

## Application Server Configuration
spring.application.name=grocery-billing-system
server.port=8080
server.servlet.context-path=/api/v1
management.endpoints.web.exposure.include=health,info

## H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:grocery_billing_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

## H2 Console (Access at http://localhost:8080/api/v1/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## JWT Configuration
jwt.secret=grocery_billing_system_secret_key_change_in_production_environment_with_strong_key
jwt.expiration=86400000
jwt.refresh-expiration=604800000

## Logging Configuration
logging.level.root=INFO
logging.level.com.grocerystore.billing=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

## File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

## Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
